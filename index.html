<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: those block pinch-zoom, which is a
         WCAG 1.4.4 failure and the single most common way a mobile site becomes
         unusable for anyone who needs to magnify it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Austin Munene - Frontend Developer and QA Engineer Portfolio" />

    <!-- Kept in step with the resolved theme by the script below and by
         useTheme, so the mobile browser chrome matches the page instead of
         being dark under a light page. The two hex values are --surface for
         each theme; they are literals because index.css is loaded by the JS
         bundle and is not parsed yet at this point. -->
    <meta name="theme-color" id="theme-color" content="#06070b" />
    <link rel="alternate" type="application/rss+xml" title="Austin Munene — Blog" href="/rss.xml" />

    <!--
      Resolve the theme before first paint. React mounts too late: without this
      the page would paint the default theme and then snap to the stored one, so
      a light-mode visitor gets a black flash on every load.

      Deliberately above the font <link> below. A synchronous script cannot run
      until every stylesheet before it has loaded - the browser has to assume the
      script might read computed styles. That font stylesheet is render-blocking
      and remote (measured at ~670ms on a cold load), so with the script beneath
      it, theme resolution was hostage to Google Fonts being reachable.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {
          /* Private mode can throw on localStorage; the dark default stands. */
        }
        root.dataset.theme = theme;

        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f9fd' : '#06070b');

        /* body and every glass surface carry 400ms colour transitions, so a
           theme applied after the first frame fades in rather than simply being
           there - which reads as a flash rather than as a page that loaded in
           the right theme. Suppressed for the first two frames only. */
        root.classList.add('theme-booting');
        var settle = function () { root.classList.remove('theme-booting'); };
        requestAnimationFrame(function () { requestAnimationFrame(settle); });
        /* rAF never fires in a background tab, and failing with transitions
           permanently off would be worse than failing with them on. */
        setTimeout(settle, 500);
      })();
    </script>


    <!-- Fonts: one request for all three families. Previously split between a
         <link> here and an @import in index.css, which serialised HTML -> CSS ->
         CSS -> fonts and loaded JetBrains Mono twice.
         Playfair Display + Josefin Sans mirrors hercartexpressessentials.com;
         Geist Mono carries code, which that reference site has no need for. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Austin Munene</title>
  </head>
  <body>
    <!--
      Netlify Forms registration.

      Netlify discovers forms by parsing the static HTML it receives at deploy
      time. The real form is rendered by React (src/components/ContactForm.tsx),
      so it does not exist in any file Netlify can parse - without this copy the
      endpoint is never created and every submission 404s.

      Hidden from people and assistive tech; it exists purely to be crawled. Field
      names must match ContactForm exactly, or those values arrive empty.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
