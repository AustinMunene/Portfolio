<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Austin Munene - Frontend Developer and QA Engineer Portfolio" />
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- Fonts: one request for all three families. Previously split between a
         <link> here and an @import in index.css, which serialised HTML -> CSS ->
         CSS -> fonts and loaded JetBrains Mono twice.
         Instrument Serif is display-only and ships a single 400 weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Austin Munene</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
